[project]
name = "datalib-app"
version = "0.1.0"
description = "The Datalib tab: runs datalib-http unchanged and serves the instances API beside it, listing the one page that carries the API token"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "app-instances",
    "app-manifest",
    "click>=8.1",
    "imbue-common",
    "loguru>=0.7",
    "pydantic>=2.0",
]

[project.scripts]
datalib-app = "datalib_app.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datalib_app"]
