# The Datalib tab: datalib's web UI (datalib-http) over the store the datalib
# skill writes. The datalib app (system/apps/datalib, installed as the
# ``datalib-app`` uv tool by system/scripts/build_workspace.sh like every
# Python app) serves the instances API on 8732, registers its manifest and
# the datalib-http port 8731 via forward_port.py, and runs
# ~/.local/bin/datalib-http as its child. That binary arrives through
# system/scripts/env.d/2000-datalib-binaries.sh on the env-converge one-shot,
# minutes into a first boot; until then the app exits without registering and
# the high startretries let supervisord keep retrying with its backoff.
# Carries the `user` band -- a user-created app, shed before any built-in.
[program:datalib]
command=python3 system/services/oom_priority/bin/oom_tag_service.py user datalib-app
directory=/home/user/workspace
autostart=true
autorestart=true
startretries=1000000
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/datalib-stdout.log
stderr_logfile=/var/log/supervisor/datalib-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3
